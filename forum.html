<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brainster Labs</title>
    <!-- BOOTSTRAP CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />

    <script
      src="https://kit.fontawesome.com/9d18197c84.js"
      crossorigin="anonymous"
    ></script>

    <!-- LOCAL MAIN CSS -->
    <link rel="stylesheet" href="./main.css" />
    <link rel="stylesheet" href="./forum.css" />
  </head>
  <body class="bg-warning">
    <div class="container-flud">
      <!-- NAVBAR -->
      <div class="row shadow">
        <div class="col">
          <nav class="navbar navbar-expand-lg navbar-light pb-0 pt-3 mb-1">
            <a class="navbar-brand img-fluid ml-m-5 mb-0" href="index.html"
              ><img
                src="./images/Logo.png"
                alt="Brainster-logo"
                class="navbar-logo pl-2"
              />
              <br />
              <p class="text-center brainster font-weight-bold">BRAINSTER</p>
            </a>
            <button
              class="navbar-toggler"
              type="button"
              data-toggle="collapse"
              data-target="#navbarTogglerDemo02"
              aria-controls="navbarTogglerDemo02"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
              <ul
                class="navbar-nav ml-auto mt-2 mt-lg-0 d-flex align-items-center font-weight-bold"
              >
                <li class="nav-item">
                  <a
                    class="nav-link mr-1"
                    href="https://brainster.co/marketing
              "
                    >Академија за маркетинг</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link mr-1"
                    href="https://brainster.co/front-end/
              "
                    >Академија за програмирање</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link mr-1"
                    href="https://brainster.co/graphic-design/
              "
                    >Академија за дизајн</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link mr-1"
                    href="https://brainster.co/data-science/
              "
                    >Академија за data-science</a
                  >
                </li>
                <li class="nav-item ml-2 mr-3 ml-lg-5">
                  <a href="forum.html"
                    ><button
                      class="btn btn-outline-success text-white bg-danger border-danger"
                      type="submit"
                    >
                      Вработи наш студент
                    </button></a
                  >
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
      <!-- BODY -->

      <div class="container-flud py-lg-5 px-lg-3 form-container">
        <div
          class="row d-flex justify-content-center align-items-center mb-lg-5"
        >
          <div class="col text-center">
            <h1 class="title hire-one-of-ours my-lg-5 my-3">
              Вработи студенти
            </h1>
          </div>
        </div>
        <div class="container my-5">
          <div class="row">
            <div class="col-md-10 offset-md-1">
              <form class="row margin-bottom" method="get" action="#">
                <div class="col-12 col-md-6 mb-2 px-4 px-md-2">
                  <div class="form-group">
                    <label for="firstname" class="pl-1 mb-1 font-weight-bold"
                      >Име и презиме</label
                    >
                    <input
                      type="text"
                      class="form-control font-italic"
                      id="firstname"
                      placeholder="Вашето име и презиме"
                    />
                  </div>
                </div>
                <div class="col-12 col-md-6 mb-2 px-4 px-md-2">
                  <div class="form-group">
                    <label for="company" class="pl-1 mb-1 font-weight-bold"
                      >Име на компанија</label
                    >
                    <input
                      type="text"
                      class="form-control font-italic"
                      id="company"
                      placeholder="Име на вашата компанија"
                    />
                  </div>
                </div>
                <div class="col-12 col-md-6 mb-2 px-4 px-md-2">
                  <div class="form-group">
                    <label for="email" class="pl-1 mb-1 font-weight-bold"
                      >Контакт имејл</label
                    >
                    <input
                      type="email"
                      class="form-control font-italic"
                      id="email"
                      placeholder="Контакт имејл на вашата компанија"
                    />
                  </div>
                </div>
                <div class="col-12 col-md-6 mb-2 px-4 px-md-2">
                  <div class="form-group">
                    <label for="phone" class="pl-1 mb-1 font-weight-bold"
                      >Контакт телефон</label
                    >
                    <input
                      type="tel"
                      class="form-control font-italic"
                      id="phone"
                      name="phone"
                      placeholder="Контакт телефон на вашата компанија"
                    />
                  </div>
                </div>
                <div class="col-12 col-md-6 mb-2 px-4 px-md-2">
                  <div class="form-group dropdown">
                    <label for="studenttype" class="pl-1 mb-1 font-weight-bold"
                      >Тип на студенти</label
                    >
                    <select
                      class="form-control select-style font-weight-bold dropbtn"
                      name="student"
                      id="studenttype"
                      value="option"
                      placeholder="Изберете тип на студент"
                    >
                      <option value="">
                        <span class="placeholder font-italic"
                          >Изберете тип на студент</span
                        >
                      </option>
                      <option value="Студент од маркетинг">
                        Студент од маркетинг
                      </option>
                      <option value="Студент од програмирање">
                        Студент од програмирање
                      </option>
                      <option value="Студент од data science">
                        Студент од data science
                      </option>
                      <option value="Студент од дизајн">
                        Студент од дизајн
                      </option>
                    </select>
                  </div>
                </div>
                <div
                  class="col-12 col-md-6 mb-2 mt-md-1 huge-margin-top mb-sm-4 px-4 px-md-2"
                >
                  <div class="form-group mt-4 huge-margin-top">
                    <button
                      type="submit"
                      id="submit"
                      class="form-control btn btn-block text-white button-forum-page"
                    >
                      Испрати
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
        <!-- ===== -->
      </div>
      <!-- FOOTER -->
      <div class="row bg-dark p-4 huge-margin-top-footer">
        <div class="col-md-12 text-center text-white">
          Изработено со &#10084; од студентите на Brainster
        </div>
      </div>
    </div>
    <!-- JQUERY JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>

    <!-- POPPER JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>

    <!-- BOOTSTRAP JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
      integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
      crossorigin="anonymous"
    ></script>
    <!-- JS -->
    <script src="./forum.js"></script>
  </body>
</html>
